<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPM Tool</title>

<style>
:root {
    --bg: #0b0d12;
    --card: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.1);
    --text: #ffffff;
    --accent: #6ea8ff;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: sans-serif;
    background: radial-gradient(circle at top, #1a1f2e, var(--bg));
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 30px;
}

.card {
    width: 100%;
    max-width: 650px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 25px;
    backdrop-filter: blur(12px);
}

h1 {
    margin-top: 0;
}

h2 {
    margin-bottom: 10px;
}

input, button {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.05);
    color: white;
    font-size: 14px;
}

button {
    cursor: pointer;
}

button:hover {
    border-color: var(--accent);
}

.section {
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
}

.result {
    font-size: 24px;
    color: var(--accent);
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="card">
    <h1>BPM Tool</h1>

    <!-- SLIDER -->
    <h2>Slider Calculator</h2>

    <input id="orig" type="number" value="128">
    <input id="target" type="number" value="120">

    <div class="result" id="sliderResult">0.000000</div>

    <!-- BPM DETECTOR -->
    <div class="section">
        <h2>BPM Detector</h2>

        <input type="file" id="audioFile" accept="audio/*">

        <button id="detectBtn">Detect BPM</button>

        <div class="result" id="bpmResult">No BPM detected yet</div>
    </div>
</div>

<script>
/* =========================
   SLIDER CALCULATOR
========================= */

const origInput = document.getElementById("orig");
const targetInput = document.getElementById("target");
const sliderResult = document.getElementById("sliderResult");

function calculateSlider() {
    const orig = parseFloat(origInput.value);
    const target = parseFloat(targetInput.value);

    if (!orig || !target) return;

    const k = 0.3613;
    const slider = 0.5 - k * Math.log(target / orig);

    sliderResult.textContent = slider.toFixed(6);
}

origInput.addEventListener("input", calculateSlider);
targetInput.addEventListener("input", calculateSlider);

calculateSlider();


/* =========================
   BPM DETECTOR (STABLE)
========================= */

const fileInput = document.getElementById("audioFile");
const detectBtn = document.getElementById("detectBtn");
const bpmResult = document.getElementById("bpmResult");

function cleanBPM(bpm) {
    bpm = Math.round(bpm * 100) / 100;

    const nearest = Math.round(bpm);

    // MUCH stricter threshold
    if (Math.abs(bpm - nearest) <= 0.25) {
        return nearest;
    }

    return bpm;
}

detectBtn.addEventListener("click", async () => {
    const file = fileInput.files[0];

    if (!file) {
        bpmResult.textContent = "Select an audio file first.";
        return;
    }

    bpmResult.textContent = "Analyzing...";

    await new Promise(requestAnimationFrame);

    const audioContext = new AudioContext();

    const arrayBuffer = await file.arrayBuffer();
    const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

    const raw = audioBuffer.getChannelData(0);

    const blockSize = 2048;
    const energy = [];

    for (let i = 0; i < raw.length; i += blockSize) {
        let sum = 0;

        for (let j = 0; j < blockSize && i + j < raw.length; j++) {
            const v = raw[i + j];
            sum += v * v;
        }

        energy.push(sum);
    }

    let bestOffset = 0;
    let bestScore = 0;

    const maxOffset = Math.min(200, Math.floor(energy.length / 2));

    for (let offset = 40; offset < maxOffset; offset++) {
        let score = 0;

        for (let i = 0; i < energy.length - offset; i++) {
            score += energy[i] * energy[i + offset];
        }

        if (score > bestScore) {
            bestScore = score;
            bestOffset = offset;
        }
    }

    if (!bestOffset) {
        bpmResult.textContent = "Could not detect BPM";
        return;
    }

    let secondsPerBeat =
        (bestOffset * blockSize) / audioContext.sampleRate;

    let bpm = 60 / secondsPerBeat;

    while (bpm < 80) bpm *= 2;
    while (bpm > 200) bpm /= 2;

    bpm = cleanBPM(bpm);

    bpmResult.textContent = "Detected BPM: " + bpm.toFixed(2);
});
</script>

</body>
</html>
