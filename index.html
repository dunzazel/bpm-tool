<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Analyzer</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, sans-serif;
    background: #0b0d12;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

.card {
    width: 92%;
    max-width: 700px;
    background: #121725;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

.section {
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid #2a3350;
}

input, button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
}

input {
    background: #1b2236;
    color: white;
}

button {
    background: #4c7dff;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #3a66dd;
}

.result {
    margin-top: 12px;
    font-size: 18px;
    color: #7aa2ff;
}
</style>
</head>

<body>

<div class="card">

    <h1>Audio Analyzer</h1>

    <!-- FL SLIDER -->
    <div class="section">
        <h2>FL Slider</h2>

        <input id="orig" type="number" value="128">
        <input id="target" type="number" value="120">

        <div class="result" id="sliderResult">0.000000</div>
    </div>

    <!-- ANALYZER -->
    <div class="section">
        <h2>Analyze Track</h2>

        <input type="file" id="audioFile" accept="audio/*">
        <button id="analyzeBtn">Analyze</button>

        <div class="result" id="bpmResult">BPM: -</div>
        <div class="result" id="keyResult">Key: -</div>
    </div>

</div>

<!-- ESSENTIA -->
<script src="https://cdn.jsdelivr.net/npm/essentia.js/dist/essentia.js"></script>

<script>

/* =========================
   FL SLIDER
========================= */

const orig = document.getElementById("orig");
const target = document.getElementById("target");
const sliderResult = document.getElementById("sliderResult");

function updateSlider() {
    const o = parseFloat(orig.value);
    const t = parseFloat(target.value);

    if (!o || !t) return;

    const k = 0.3613;
    const val = 0.5 - k * Math.log(t / o);

    sliderResult.textContent = val.toFixed(6);
}

orig.addEventListener("input", updateSlider);
target.addEventListener("input", updateSlider);
updateSlider();


/* =========================
   ESSENTIA SETUP
========================= */

const audioFile = document.getElementById("audioFile");
const analyzeBtn = document.getElementById("analyzeBtn");
const bpmResult = document.getElementById("bpmResult");
const keyResult = document.getElementById("keyResult");

let essentia;

async function init() {
    const EssentiaWASM = await EssentiaModule();
    essentia = new Essentia(EssentiaWASM);
}

init();


/* =========================
   ANALYSIS
========================= */

analyzeBtn.addEventListener("click", async () => {

    const file = audioFile.files[0];
    if (!file) return;

    bpmResult.textContent = "BPM: analyzing...";
    keyResult.textContent = "Key: analyzing...";

    const audioContext = new AudioContext();
    const buffer = await audioContext.decodeAudioData(await file.arrayBuffer());

    /* =========================
       FAST TRIM (fix slow analysis)
    ========================= */

    const maxSeconds = 30;
    const limit = Math.min(buffer.length, buffer.sampleRate * maxSeconds);
    const raw = buffer.getChannelData(0).slice(0, limit);

    const vector = essentia.arrayToVector(raw);

    /* =========================
       BPM
    ========================= */

    const rhythm = essentia.RhythmExtractor2013(vector, buffer.sampleRate);

    let bpm = rhythm.bpm;

    while (bpm < 80) bpm *= 2;
    while (bpm > 200) bpm /= 2;

    bpm = Math.round(bpm * 100) / 100;

    bpmResult.textContent = "BPM: " + bpm;

    /* =========================
       KEY DETECTION
    ========================= */

    const keyData = essentia.KeyExtractor(vector, buffer.sampleRate);

    const key = keyData.key;
    const scale = keyData.scale;
    const confidence =
        keyData.strength || keyData.confidence || 0;

    keyResult.textContent =
        `Key: ${key} ${scale} (${(confidence * 100).toFixed(1)}%)`;
});

</script>

</body>
</html>
