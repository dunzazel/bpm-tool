<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Analyzer</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, sans-serif;
    background: #0b0d12;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

.card {
    width: 92%;
    max-width: 700px;
    background: #121725;
    padding: 24px;
    border-radius: 16px;
}

.section {
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid #2a3350;
}

input, button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 10px;
    border: none;
}

input { background:#1b2236; color:white; }
button { background:#4c7dff; color:white; cursor:pointer; }

.result {
    margin-top: 12px;
    font-size: 18px;
    color: #7aa2ff;
}
</style>
</head>

<body>

<div class="card">

<h1>Audio Analyzer</h1>

<div class="section">
    <h2>FL Slider</h2>
    <input id="orig" type="number" value="128">
    <input id="target" type="number" value="120">
    <div class="result" id="sliderResult"></div>
</div>

<div class="section">
    <h2>Analyze</h2>
    <input type="file" id="audioFile">
    <button id="analyzeBtn">Analyze</button>

    <div class="result" id="bpmResult">BPM: -</div>
    <div class="result" id="keyResult">Key: -</div>
</div>

</div>

<script>

/* =========================
   FL SLIDER
========================= */

const orig = document.getElementById("orig");
const target = document.getElementById("target");
const sliderResult = document.getElementById("sliderResult");

function updateSlider() {
    const o = parseFloat(orig.value);
    const t = parseFloat(target.value);

    const k = 0.3613;
    const val = 0.5 - k * Math.log(t / o);

    sliderResult.textContent = val.toFixed(6);
}

orig.oninput = updateSlider;
target.oninput = updateSlider;
updateSlider();


/* =========================
   SIMPLE BPM DETECTOR (STABLE)
========================= */

function detectBPM(signal, sampleRate) {

    const block = 1024;
    let energy = [];

    for (let i = 0; i < signal.length; i += block) {
        let sum = 0;

        for (let j = 0; j < block && i + j < signal.length; j++) {
            const v = signal[i + j];
            sum += Math.abs(v);
        }

        energy.push(sum);
    }

    const max = Math.max(...energy) || 1;
    energy = energy.map(v => v / max);

    const sr = sampleRate / block;

    const minLag = Math.floor((sr * 60) / 200);
    const maxLag = Math.floor((sr * 60) / 60);

    let bestLag = 0;
    let best = -Infinity;

    for (let lag = minLag; lag < maxLag; lag++) {
        let score = 0;

        for (let i = 0; i < energy.length - lag; i++) {
            score += energy[i] * energy[i + lag];
        }

        if (score > best) {
            best = score;
            bestLag = lag;
        }
    }

    let bpm = 60 * sr / bestLag;

    while (bpm < 80) bpm *= 2;
    while (bpm > 200) bpm /= 2;

    return Math.round(bpm * 100) / 100;
}


/* =========================
   SIMPLE KEY DETECTION (LIGHTWEIGHT)
========================= */

function detectKey(signal) {

    const notes = new Array(12).fill(0);

    for (let i = 0; i < signal.length; i += 2048) {

        let chunk = 0;

        for (let j = 0; j < 2048 && i + j < signal.length; j++) {
            chunk += Math.abs(signal[i + j]);
        }

        notes[i % 12] += chunk;
    }

    const names = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

    let best = 0;
    for (let i = 1; i < 12; i++) {
        if (notes[i] > notes[best]) best = i;
    }

    return names[best];
}


/* =========================
   MAIN
========================= */

document.getElementById("analyzeBtn").onclick = async () => {

    const file = document.getElementById("audioFile").files[0];
    if (!file) return;

    document.getElementById("bpmResult").textContent = "BPM: analyzing...";
    document.getElementById("keyResult").textContent = "Key: analyzing...";

    const ctx = new AudioContext();
    const buffer = await ctx.decodeAudioData(await file.arrayBuffer());

    const signal = buffer.getChannelData(0);

    const bpm = detectBPM(signal, buffer.sampleRate);
    const key = detectKey(signal);

    document.getElementById("bpmResult").textContent = "BPM: " + bpm;
    document.getElementById("keyResult").textContent = "Key: " + key;
};

</script>

</body>
</html>
