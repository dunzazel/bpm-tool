<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPM Slider Calculator</title>

<style>
:root {
    --bg: #0b0d12;
    --card: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.1);
    --text: #ffffff;
    --accent: #6ea8ff;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at top, #1a1f2e, var(--bg));
    font-family: sans-serif;
    color: var(--text);
    padding: 20px;
    overflow: hidden;
}

.card {
    width: 100%;
    max-width: 520px;
    padding: 28px;
    border-radius: 24px;
    background: var(--card);
    border: 1px solid var(--border);
    backdrop-filter: blur(14px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: floatIn 0.8s ease;
}

@keyframes floatIn {
    from {
        transform: translateY(20px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

h1 {
    margin: 0 0 20px;
    font-size: 1.8rem;
}

label {
    display: block;
    margin-top: 14px;
    opacity: 0.8;
    font-size: 0.9rem;
}

input {
    width: 100%;
    padding: 14px;
    margin-top: 6px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.05);
    color: var(--text);
    outline: none;
    transition: 0.2s ease;
}

input:focus {
    border-color: var(--accent);
    transform: scale(1.02);
}

.result-box {
    margin-top: 22px;
    padding: 18px;
    border-radius: 18px;
    background: rgba(255,255,255,0.05);
    text-align: center;
    transition: 0.3s ease;
}

.result {
    font-size: 2.4rem;
    font-weight: bold;
    color: var(--accent);
    margin-top: 8px;
    transition: transform 0.2s ease;
}

.result.animate {
    transform: scale(1.08);
}
</style>
</head>

<body>

<div class="card">
    <h1>BPM Slider Calculator</h1>

    <label>Original BPM</label>
    <input id="orig" type="number" step="0.001" value="128">

    <label>Target BPM</label>
    <input id="target" type="number" step="0.001" value="120">

    <div class="result-box">
        <div>Slider Value</div>
        <div class="result" id="result">0.000000</div>
    </div>
</div>

<script>
const origInput = document.getElementById("orig");
const targetInput = document.getElementById("target");
const result = document.getElementById("result");

function animate() {
    result.classList.add("animate");
    setTimeout(() => result.classList.remove("animate"), 150);
}

// FL-style log model (no guess exponent)
function calculate() {
    const orig = parseFloat(origInput.value);
    const target = parseFloat(targetInput.value);

    if (!orig || !target) return;

    const k = 0.3613;

    const slider = 0.5 - k * Math.log(target / orig);

    const output = Math.max(0, Math.min(1, slider)).toFixed(6);

    if (result.textContent !== output) {
        animate();
    }

    result.textContent = output;
}

origInput.addEventListener("input", calculate);
targetInput.addEventListener("input", calculate);

calculate();
</script>

</body>
</html>
