<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPM Tool</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, sans-serif;
    background: #0b0d12;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

.card {
    width: 92%;
    max-width: 700px;
    background: #121725;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

h1 {
    margin-top: 0;
}

.section {
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid #2a3350;
}

input, button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
}

input {
    background: #1b2236;
    color: white;
}

button {
    background: #4c7dff;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #3a66dd;
}

.result {
    margin-top: 12px;
    font-size: 20px;
    color: #7aa2ff;
}
</style>
</head>

<body>

<div class="card">
    <h1>BPM Tool</h1>

    <!-- FL SLIDER -->
    <div class="section">
        <h2>FL Slider Calculator</h2>

        <input id="orig" type="number" value="128" placeholder="Original BPM">
        <input id="target" type="number" value="120" placeholder="Target BPM">

        <div class="result" id="sliderResult">0.000000</div>
    </div>

    <!-- BPM DETECTOR -->
    <div class="section">
        <h2>BPM Detector</h2>

        <input type="file" id="audioFile" accept="audio/*">
        <button id="detectBtn">Detect BPM</button>

        <div class="result" id="bpmResult">Waiting...</div>
    </div>
</div>

<script>

/* =========================
   SLIDER CALCULATOR
========================= */

const orig = document.getElementById("orig");
const target = document.getElementById("target");
const sliderResult = document.getElementById("sliderResult");

function updateSlider() {
    const o = parseFloat(orig.value);
    const t = parseFloat(target.value);

    if (!o || !t) return;

    const k = 0.3613;
    const val = 0.5 - k * Math.log(t / o);

    sliderResult.textContent = val.toFixed(6);
}

orig.addEventListener("input", updateSlider);
target.addEventListener("input", updateSlider);

updateSlider();


/* =========================
   BPM DETECTOR (STABLE CORE)
========================= */

const fileInput = document.getElementById("audioFile");
const detectBtn = document.getElementById("detectBtn");
const bpmResult = document.getElementById("bpmResult");

detectBtn.addEventListener("click", async () => {

    const file = fileInput.files[0];
    if (!file) {
        bpmResult.textContent = "Select a file first.";
        return;
    }

    bpmResult.textContent = "Analyzing...";

    await new Promise(requestAnimationFrame);

    const audioContext = new AudioContext();

    const arrayBuffer = await file.arrayBuffer();
    const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

    const raw = audioBuffer.getChannelData(0);

    /* =========================
       STEP 1: energy envelope
    ========================= */

    const block = 1024;
    let energy = [];

    for (let i = 0; i < raw.length; i += block) {
        let sum = 0;

        for (let j = 0; j < block && i + j < raw.length; j++) {
            sum += Math.abs(raw[i + j]);
        }

        energy.push(sum);
    }

    /* normalize */
    const maxVal = Math.max(...energy) || 1;
    energy = energy.map(v => v / maxVal);

    /* =========================
       STEP 2: candidate scoring (FIXES DRIFT)
    ========================= */

    const sampleRate = audioContext.sampleRate / block;

    const minLag = Math.floor((sampleRate * 60) / 200);
    const maxLag = Math.floor((sampleRate * 60) / 60);

    let candidates = [];

    for (let lag = minLag; lag < maxLag; lag++) {

        let score = 0;

        for (let i = 0; i < energy.length - lag; i++) {
            score += energy[i] * energy[i + lag];
        }

        const bpm = 60 * sampleRate / lag;

        candidates.push({ bpm, score });
    }

    /* =========================
       STEP 3: pick best candidates
    ========================= */

    candidates.sort((a, b) => b.score - a.score);

    const top = candidates.slice(0, 7);

    top.sort((a, b) => a.bpm - b.bpm);

    let bpm = top[Math.floor(top.length / 2)].bpm;

    /* =========================
       STEP 4: light cleanup only
    ========================= */

    while (bpm < 80) bpm *= 2;
    while (bpm > 200) bpm /= 2;

    bpm = Math.round(bpm * 100) / 100;

    bpmResult.textContent = "Detected BPM: " + bpm;
});

</script>

</body>
</html>
