<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FL Tempo Slider</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0d12;
    color: white;
    font-family: system-ui;
}

.card {
    width: 400px;
    background: #121725;
    padding: 20px;
    border-radius: 12px;
}

input {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #1b2236;
    color: white;
}

.result {
    margin-top: 15px;
    font-size: 22px;
    color: #7aa2ff;
}
</style>
</head>

<body>

<div class="card">

<h2>FL Tempo Slider</h2>

<input id="orig" type="number" value="130">
<input id="target" type="number" value="140">

<div class="result" id="out">0.500000</div>

</div>

<script>

const orig = document.getElementById("orig");
const target = document.getElementById("target");
const out = document.getElementById("out");

/* FITTED MODEL */
const k = 0.349;
const a = 0.041;

function update() {
    const o = parseFloat(orig.value);
    const t = parseFloat(target.value);

    if (!o || !t || o <= 0 || t <= 0) return;

    const x = Math.log(t / o);

    const value = 0.5 - k * x + a * x * x;

    out.textContent = value.toFixed(6);
}

orig.oninput = update;
target.oninput = update;

update();

</script>

</body>
</html>
