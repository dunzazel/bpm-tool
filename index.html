<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FL Tempo Slider</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: #0b0d12;
    font-family: system-ui;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* BIG MAIN PANEL */
.panel {
    width: min(900px, 92vw);
    padding: 40px;
    border-radius: 18px;
    background: linear-gradient(180deg, #121725, #0f1422);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}

/* TITLE */
h1 {
    margin: 0 0 30px 0;
    font-size: 28px;
    letter-spacing: 1px;
    color: #7aa2ff;
}

/* GRID LAYOUT */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
}

/* INPUT BLOCKS */
.block {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

label {
    font-size: 14px;
    opacity: 0.8;
}

input {
    padding: 16px;
    font-size: 18px;
    border-radius: 10px;
    border: none;
    background: #1b2236;
    color: white;
    outline: none;
}

/* RESULT */
.resultBox {
    margin-top: 30px;
    padding: 20px;
    border-radius: 12px;
    background: #151c2e;
    font-size: 28px;
    color: #7aa2ff;
    text-align: center;
}

/* small hint */
.hint {
    margin-top: 10px;
    font-size: 12px;
    opacity: 0.6;
    text-align: center;
}
</style>
</head>

<body>

<div class="panel">

<h1>FL Tempo Slider</h1>

<div class="grid">

    <div class="block">
        <label>Original BPM</label>
        <input id="orig" type="number" value="130">
    </div>

    <div class="block">
        <label>Target BPM</label>
        <input id="target" type="number" value="140">
    </div>

</div>

<div class="resultBox" id="out">0.500000</div>
<div class="hint">0.5 = center reference</div>

</div>

<script>

/* KEEP YOUR CURRENT MODEL */
const A = -0.355;
const B = 0.92;

const orig = document.getElementById("orig");
const target = document.getElementById("target");
const out = document.getElementById("out");

function update() {
    const o = parseFloat(orig.value);
    const t = parseFloat(target.value);

    if (!o || !t || o <= 0 || t <= 0) return;

    const x = Math.log(t / o);

    const value = 0.5 + (A * x) / (1 + B * Math.abs(x));

    out.textContent = value.toFixed(6);
}

orig.oninput = update;
target.oninput = update;

update();

</script>

</body>
</html>
