<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPM Tool</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, sans-serif;
    background: #0b0d12;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

.card {
    width: 92%;
    max-width: 700px;
    background: #121725;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

.section {
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid #2a3350;
}

input, button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
}

input {
    background: #1b2236;
    color: white;
}

button {
    background: #4c7dff;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #3a66dd;
}

.result {
    margin-top: 12px;
    font-size: 20px;
    color: #7aa2ff;
}
</style>
</head>

<body>

<div class="card">

    <h1>BPM Tool</h1>

    <!-- SLIDER -->
    <div class="section">
        <h2>FL Slider</h2>

        <input id="orig" type="number" value="128">
        <input id="target" type="number" value="120">

        <div class="result" id="sliderResult">0.000000</div>
    </div>

    <!-- BPM DETECTOR -->
    <div class="section">
        <h2>BPM Detector</h2>

        <input type="file" id="audioFile" accept="audio/*">
        <button id="detectBtn">Detect BPM</button>

        <div class="result" id="bpmResult">Waiting...</div>
    </div>

</div>

<!-- ESSENTIA -->
<script src="https://cdn.jsdelivr.net/npm/essentia.js/dist/essentia.js"></script>

<script>

/* =========================
   FL SLIDER
========================= */

const orig = document.getElementById("orig");
const target = document.getElementById("target");
const sliderResult = document.getElementById("sliderResult");

function updateSlider() {
    const o = parseFloat(orig.value);
    const t = parseFloat(target.value);

    if (!o || !t) return;

    const k = 0.3613;
    const val = 0.5 - k * Math.log(t / o);

    sliderResult.textContent = val.toFixed(6);
}

orig.addEventListener("input", updateSlider);
target.addEventListener("input", updateSlider);
updateSlider();


/* =========================
   ESSENTIA BPM
========================= */

const fileInput = document.getElementById("audioFile");
const detectBtn = document.getElementById("detectBtn");
const bpmResult = document.getElementById("bpmResult");

let essentia;

async function init() {
    const EssentiaWASM = await EssentiaModule();
    essentia = new Essentia(EssentiaWASM);
}

init();

detectBtn.addEventListener("click", async () => {

    const file = fileInput.files[0];

    if (!file) {
        bpmResult.textContent = "Select a file first.";
        return;
    }

    bpmResult.textContent = "Analyzing...";

    const audioContext = new AudioContext();

    const buffer = await audioContext.decodeAudioData(await file.arrayBuffer());

    const signal = buffer.getChannelData(0);

    const vector = essentia.arrayToVector(signal);

    const rhythm = essentia.RhythmExtractor2013(vector, buffer.sampleRate);

    let bpm = rhythm.bpm;

    while (bpm < 80) bpm *= 2;
    while (bpm > 200) bpm /= 2;

    bpm = Math.round(bpm * 100) / 100;

    bpmResult.textContent =
        `Detected BPM: ${bpm}`;
});

</script>

</body>
</html>
