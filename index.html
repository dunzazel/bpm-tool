<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FL Slider Tool</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, sans-serif;
    background: #0b0d12;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

.card {
    width: 92%;
    max-width: 500px;
    background: #121725;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

.section {
    margin-top: 20px;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    background: #1b2236;
    color: white;
}

.result {
    margin-top: 15px;
    font-size: 20px;
    color: #7aa2ff;
}
</style>
</head>

<body>

<div class="card">

    <h1>FL Tempo Slider</h1>

    <div class="section">
        <input id="orig" type="number" value="128" placeholder="Original BPM">
        <input id="target" type="number" value="120" placeholder="Target BPM">

        <div class="result" id="sliderResult">0.000000</div>
    </div>

</div>

<script>

const orig = document.getElementById("orig");
const target = document.getElementById("target");
const sliderResult = document.getElementById("sliderResult");

function updateSlider() {
    const o = parseFloat(orig.value);
    const t = parseFloat(target.value);

    if (!o || !t || o <= 0 || t <= 0) return;

    const ratio = t / o;
    const value = Math.log2(ratio);

    sliderResult.textContent = value.toFixed(6);
}

orig.addEventListener("input", updateSlider);
target.addEventListener("input", updateSlider);

updateSlider();

</script>

</body>
</html>
